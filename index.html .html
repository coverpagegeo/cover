/* Layout: form column + live A4 preview; stacks on phones. Palette follows the university crest (green, gold, ink). */
:root{
  --bg:#f3f2ee; --panel:#ffffff; --ink:#1c2420; --muted:#5d6a63; --line:#d9d8d0;
  --green:#1f6b4a; --green-ink:#ffffff; --gold:#f2c200; --field:#faf9f6;
  --ui:'Inter','Noto Sans Bengali',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{--bg:#141a17;--panel:#1d2521;--ink:#e9ede9;--muted:#9aa8a0;--line:#33403a;--green:#3fa675;--green-ink:#0d1712;--field:#171e1b}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5}
.app{max-width:1180px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:20px;grid-template-columns:minmax(0,380px) minmax(0,1fr);align-items:start}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}}
header.top{grid-column:1/-1;display:flex;align-items:center;gap:12px}
header.top img{width:40px;height:auto}
header.top h1{font-size:20px;margin:0;font-weight:600}
header.top p{margin:0;color:var(--muted);font-size:13px}
.lang{margin-left:auto;display:flex;gap:4px;flex-shrink:0}
.lang button{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:8px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--green);color:var(--green-ink);border-color:var(--green);font-weight:600}
.credit{grid-column:1/-1;text-align:center;color:var(--muted);font-size:13px;padding-top:4px}
.credit b{color:var(--ink);font-weight:600;letter-spacing:.02em}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.tabs button{font:inherit;font-size:13px;padding:9px 4px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:8px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--green);color:var(--green-ink);border-color:var(--green);font-weight:600}
fieldset{border:0;padding:0;margin:0 0 14px;display:grid;gap:10px}
legend{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0;margin-bottom:6px;font-weight:600}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
input,textarea,select{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:7px;padding:9px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--green);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
.actions{display:grid;gap:8px;margin-top:4px}
.btn{font:inherit;font-weight:600;padding:11px 14px;border-radius:8px;border:1px solid var(--green);cursor:pointer;background:var(--green);color:var(--green-ink)}
.btn.alt{background:transparent;color:var(--green)}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.stagewrap{min-width:0;position:sticky;top:12px}
@media (max-width:860px){.stagewrap{position:static}}
.stage{position:relative;width:100%;overflow:hidden;border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,.18);background:#fff}

/* ---------- The A4 page (also used for print) ---------- */
.page{width:210mm;height:297mm;background:#fff;color:#000;font-family:'CoverSerif',serif;font-synthesis:none;text-rendering:geometricPrecision;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;font-kerning:normal;
  padding:26mm 18mm 18mm;position:absolute;top:0;left:0;transform-origin:top left;display:flex;flex-direction:column;align-items:center;text-align:center}
.page img.logo{width:40mm;height:auto;display:block;margin:0 auto 5mm}
.page .uni{font-weight:700;font-size:18pt;letter-spacing:.01em;margin:0}
.page .dept{font-weight:700;font-size:21pt;margin:1mm 0 0}
.page .big{font-weight:700;font-size:30pt;margin:20mm 0 0}
.page .quote{font-weight:700;font-size:19pt;margin:16mm 0 0}
.page .course{font-weight:700;font-size:16pt;margin:14mm 0 0;line-height:1.5}
.page .two{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10mm;margin-top:24mm;text-align:left;font-size:15pt;line-height:1.55}
.page .two .to{text-align:center}
.page .two h4{margin:0 0 3mm;font-size:15.5pt;text-decoration:underline;font-weight:700}
.page .b{font-weight:700}
.page .fr-title{font-weight:700;font-size:21pt;line-height:1.3;margin:18mm 6mm 0;text-transform:uppercase}
.page .fr-note{font-style:italic;font-weight:700;font-size:16pt;line-height:1.35;margin:14mm 6mm 0}
.page .fr-by{font-weight:700;font-size:16pt;margin:24mm 0 0}
.page .fr-name{font-weight:700;font-size:17pt;margin:4mm 0 0;text-transform:uppercase}
.page table.fr{margin:8mm auto 0;font-size:16pt;font-weight:700;text-align:left;border-collapse:collapse}
.page table.fr td{padding:0 2mm}
.page .fr-group{font-weight:700;font-size:16pt;margin:6mm 0 0}
.page .fr-dept{font-weight:700;font-size:15pt;margin:10mm 6mm 0;line-height:1.35;text-transform:uppercase}
.page .fr-date sup{text-transform:none}
.page .fr-date{font-weight:700;font-size:14pt;margin:6mm 0 0;text-transform:uppercase}

@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff}
  .app>*:not(.stagewrap),.stagewrap>*:not(.stage){display:none!important}
  .app{display:block;padding:0;max-width:none}
  .stagewrap{position:static}
  .stage{box-shadow:none;border-radius:0;overflow:visible;height:297mm!important}
  .page{transform:none!important}
}
</style>
</head>
<body>

      if(cp.value==='new'){ el.ctitle.value=''; el.ccode.value=''; touched[state.type+'ctitle']=true; touched[state.type+'ccode']=true; save(); render(); (state.type==='field'?el.ccode:el.ctitle).focus(); return; }
      var p=cp.value.split('.'), c=COURSES[p[0]][1][p[1]];
      el.ctitle.value=c[1]; el.ccode.value=fmtCode(c[0]); touched[state.type+'ctitle']=true; touched[state.type+'ccode']=true; save(); render();
    });
    var dl=document.getElementById('sessions');
    for(var y=2022;y<=2030;y++){ opt(dl,y+'-'+(y+1),''); }
    tp.addEventListener('change',function(){
      if(!tp.value) return; var p=tp.value.split('.'), g=TEACHERS[p[0]], t=g[2][p[1]];
      el.tname.value=t[0]; el.tdesig.value=t[1]; el.tdept.value=D[g[1]]; el.tinst.value='JSTU'; save(); render();
    });
  })();

  function fmtCode(c){ var m=/^(\d{4})[- ]?(\d{4})$/.exec(String(c).trim()); if(!m) return c; return m[1]+(state.type==='field'?' ':'-')+m[2]; }
  function sessText(t){
    var m=/^\s*(\d{4})\s*[-–]\s*(\d{2,4})\s*$/.exec(el.session.value);
    if(!m) return esc(el.session.value);
    var a=m[1], b=m[2];
    return t==='field' ? a+'-'+b.slice(-2) : a+' - '+(b.length===2?a.slice(0,2)+b:b);
  }

  // per-type default titles / fields
  var DEF = {
    assignment:{title:'ASSIGNMENT FOR CLASS TEST–2',lt:'অ্যাসাইনমেন্টের শিরোনাম'},
    lab:{title:'LAB REPORT',lt:'রিপোর্টের শিরোনাম'},
    field:{title:'GEOLOGICAL FIELD REPORT ON SITAKUND ANTICLINE, SITAKUND, CHATTOGRAM, BANGLADESH',lt:'রিপোর্টের শিরোনাম'}
  };
  var COURSE = {
    assignment:['Physics II : Electricity & Magnetism','0533-2251'],
    lab:['Physics lab: Electricity & Magnetism lab','0533-2252'],
    field:['','0532 1262']
  };

  function esc(s){ return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function ord(n){ var s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
  function dateParts(){ var v=el.date.value; if(!v) return null; var p=v.split('-'); return {y:p[0],m:+p[1],d:+p[2]}; }
  function dateSlash(){ var d=dateParts(); if(!d) return ''; return ('0'+d.d).slice(-2)+'/'+('0'+d.m).slice(-2)+'/'+d.y; }
  var MONTHS=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
  function dateLong(){ var d=dateParts(); if(!d) return ''; return ord(d.d).replace(/(st|nd|rd|th)$/,'<sup>$1</sup>')+' '+MONTHS[d.m-1]+', '+d.y; }

  function render(){
    var t = state.type, v = function(k){ return esc(el[k].value); };
    var h = '<img class="logo" src="'+LOGO+'" alt="">';
    if(t==='field'){
      h += '<div class="fr-title">'+v('title')+'</div>';
      h += '<div class="fr-note">'+v('note')+'</div>';
      h += '<div class="fr-by">Submitted By</div><div class="fr-name">'+v('sname')+'</div>';
      h += '<table class="fr"><tr><td>Examination Roll No.</td><td>: '+v('sid')+'</td></tr>'
         + '<tr><td>Session</td><td>: '+sessText('field')+'</td></tr>'
         + '<tr><td>Course Code</td><td>: '+v('ccode')+'</td></tr></table>';
      if(el.group.value) h += '<div class="fr-group">Group: '+v('group')+'</div>';
      h += '<div class="fr-dept">'+v('instline')+'</div>';
      h += '<div class="fr-date">'+dateLong()+'</div>';
    } else {
      h += '<div class="uni">'+v('uni').toUpperCase()+'</div><div class="dept">'+v('dept')+'</div>';
      if(t==='assignment') h += '<div class="quote">“'+v('title')+'”</div>';
      else h += '<div class="big">'+v('title')+'</div>';
      h += '<div class="course">Course title: '+v('ctitle')+'<br>Course Code: '+v('ccode')+'</div>';
      h += '<div class="two"><div class="to"><h4>Submitted to:</h4><div class="b">'+v('tname')+'</div>'
         + '<div>'+v('tdesig')+'</div><div>'+v('tdept')+'</div><div>'+v('tinst')+'</div></div>'
         + '<div><h4>Submitted By:</h4><div><span class="b">Name:</span> '+v('sname')+'</div>'
         + '<div><span class="b">Student ID:</span> '+v('sid')+'</div>'
         + '<div><span class="b">Session:</span> '+sessText(t)+'</div>'
         + '<div><span class="b">Submission Date:</span> '+dateSlash()+'</div></div></div>';
    }
    page.className = t==='field' ? 'page f-field' : 'page';
    page.innerHTML = h;
    fit();
  }

  function fit(){
    var s = stage.clientWidth / MM;
    page.style.transform = 'scale('+s+')';
    stage.style.height = (297/210*stage.clientWidth)+'px';
  }

  function setType(t){
    state.type = t;
    Array.prototype.forEach.call(document.querySelectorAll('.tabs button'),function(b){ b.setAttribute('aria-pressed', b.dataset.type===t ? 'true':'false'); });
    var f = t==='field';
    document.getElementById('fs-uni').hidden = f;
    document.getElementById('fs-to').hidden = f;
    document.getElementById('l-ctitle').hidden = f;
    document.getElementById('l-note').hidden = !f;
    document.getElementById('l-group').hidden = !f;
    document.getElementById('l-inst').hidden = !f;
    refreshDyn();
    if(!touched[t+'title']) el.title.value = DEF[t].title;
    if(!touched[t+'ctitle']) el.ctitle.value = COURSE[t][0];
    if(!touched[t+'ccode']) el.ccode.value = fmtCode(COURSE[t][1]); else el.ccode.value = fmtCode(el.ccode.value);
    save(); render();
  }

  var touched = {};
  function save(){ try{ var o={type:state.type,touched:touched}; ids.forEach(function(i){o[i]=el[i].value;}); localStorage.setItem('coverpage-v2',JSON.stringify(o)); }catch(e){} }
  function load(){ try{ var o=JSON.parse(localStorage.getItem('coverpage-v2')||'null'); if(!o) return; touched=o.touched||{}; ids.forEach(function(i){ if(o[i]!=null) el[i].value=o[i]; }); if(o.type) state.type=o.type; }catch(e){} }

  ids.forEach(function(i){ el[i].addEventListener('input',function(){ if(i==='title'||i==='ctitle'||i==='ccode') touched[state.type+i]=true; save(); render(); }); });
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'),function(b){ b.addEventListener('click',function(){ setType(b.dataset.type); }); });
  window.addEventListener('resize',fit);
  if(window.ResizeObserver) new ResizeObserver(fit).observe(stage);

  document.getElementById('btn-pdf').addEventListener('click',function(){ window.print(); });

  document.getElementById('btn-word').addEventListener('click',function(){
    var css = '<style>@page{size:A4;margin:20mm 15mm}body{font-family:"Times New Roman",serif;text-align:center}'
      +'.uni{font-weight:bold;font-size:17pt;margin:0}.dept{font-weight:bold;font-size:20pt;margin:0}'
      +'.big{font-weight:bold;font-size:28pt;margin-top:36pt}.quote{font-weight:bold;font-size:18pt;margin-top:30pt}'
      +'.course{font-weight:bold;font-size:15pt;margin-top:30pt}h4{font-size:14pt;text-decoration:underline;margin:0 0 6pt}'
      +'.fr-title{font-weight:bold;font-size:20pt;margin-top:34pt}.fr-note{font-style:italic;font-weight:bold;font-size:15pt;margin-top:28pt}'
      +'.fr-by,.fr-name,.fr-group,.fr-dept,.fr-date{font-weight:bold;font-size:15pt;margin-top:12pt}'
      +'td{font-size:14pt;padding:2pt 6pt;vertical-align:top}</style>';
    var inner = page.innerHTML;
    if(state.type!=='field'){
      // use a table for the two columns so Word keeps them side by side
      var t=state.type;
      var v=function(k){return esc(el[k].value);};
      inner = '<p><img src="'+LOGO+'" width="150" height="142"></p><p class="uni">'+v('uni').toUpperCase()+'</p><p class="dept">'+v('dept')+'</p>'
        +(t==='assignment'?'<p class="quote">“'+v('title')+'”</p>':'<p class="big">'+v('title')+'</p>')
        +'<p class="course">Course title: '+v('ctitle')+'<br>Course Code: '+v('ccode')+'</p><br><br>'
        +'<table width="100%"><tr><td width="50%" align="center"><h4>Submitted to:</h4><b>'+v('tname')+'</b><br>'+v('tdesig')+'<br>'+v('tdept')+'<br>'+v('tinst')+'</td>'
        +'<td width="50%" align="left"><h4>Submitted By:</h4><b>Name:</b> '+v('sname')+'<br><b>Student ID:</b> '+v('sid')+'<br><b>Session:</b> '+sessText(t)+'<br><b>Submission Date:</b> '+dateSlash()+'</td></tr></table>';
    } else {
      inner = inner.replace('class="logo"','width="150" height="142"');
    }
    var html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>Cover Page</title>'+css+'</head><body>'+inner+'</body></html>';
    var blob = new Blob(['﻿',html],{type:'application/msword'});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'cover-page-'+state.type+'.doc'; document.body.appendChild(a); a.click(); a.remove();
  });

  function walk(){
    var w=document.createTreeWalker(document.querySelector('.app'),NodeFilter.SHOW_TEXT), n;
    while((n=w.nextNode())){
      var pe=n.parentElement; if(!pe||/^(OPTION|TEXTAREA|SCRIPT|STYLE)$/.test(pe.tagName)||pe.closest('#stage')||pe.closest('[data-dyn]')) continue;
      if(!n.nodeValue.trim()) continue;
      if(n.__bn===undefined) n.__bn=n.nodeValue;
      var key=n.__bn.trim(), out=(LANG==='en'&&EN[key])?n.__bn.replace(key,EN[key]):n.__bn;
      if(n.nodeValue!==out) n.nodeValue=out;
    }
  }
  function refreshDyn(){
    var f=state.type==='field';
    document.getElementById('idlabel').textContent = T(f ? 'এক্সাম রোল নম্বর' : 'স্টুডেন্ট আইডি');
    document.getElementById('l-title').firstChild.nodeValue = T(DEF[state.type].lt);
  }
  function setLang(l,persist){
    LANG=l; document.documentElement.lang = l==='en'?'en':'bn';
    document.title = T('কভার পেইজ জেনারেটর');
    Array.prototype.forEach.call(document.querySelectorAll('.lang button'),function(b){ b.setAttribute('aria-pressed', b.dataset.lang===l?'true':'false'); });
    walk(); refreshDyn(); buildPickers();
    if(persist){ try{ localStorage.setItem('coverpage-lang',l); }catch(e){} }
  }
  Array.prototype.forEach.call(document.querySelectorAll('.lang button'),function(b){ b.addEventListener('click',function(){ setLang(b.dataset.lang,true); }); });

  load(); setType(state.type);
  try{ var sl=localStorage.getItem('coverpage-lang'); if(sl==='en') setLang('en',false); }catch(e){}
})();
</script>
</body>
</html>
